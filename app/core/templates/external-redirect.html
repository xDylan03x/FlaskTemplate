{% extends 'base.html' %}
{% block content %}

    <div class="centered-container">
        <div class="card bg-base-200 border border-base-300 shadow-sm w-full max-w-lg">
            <div class="card-body gap-0 p-6 sm:p-8">
                <h1 class="text-2xl font-bold text-base-content text-center">Redirect Requested</h1>
                <p class="text-sm text-base-content/80 text-center mt-2">You're about to visit another website. Review the address below to determine if it's safe before you continue.</p>

                <div class="mt-6">
                    <p class="label text-sm font-medium text-base-content">Destination</p>
                    <p class="text-sm text-base-content/80 mt-1 break-all">{{ url }}</p>
                </div>

                <a href="{{ url }}" class="btn btn-primary text-primary-content mt-6 w-full">Continue to Website</a>

                <a href="{{ url_for('core.index') }}" class="btn btn-ghost mt-2 w-full">Back to Application</a>
            </div>
        </div>
    </div>

{% endblock %}
