{% if session['actual_user'] %}
    <div class="bg-info shadow text-info-content print:hidden">
        <div class="navbar max-w-6xl px-6 mx-auto">
            <div class="flex-1 flex flex-row items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                </svg>
                <p>Impersonating {{ current_user.name }}</p>
            </div>
            <div>
                <form action="{{ url_for('core.impersonate_user') }}" method="post">
                    {% if action_form.csrf_token is defined %}
                        {{ action_form.csrf_token(id='end_impersonation_csrf_token') }}
                    {% endif %}
                    <button type="submit" class="btn btn-sm btn-soft">End Session</button>
                </form>
            </div>
        </div>
    </div>
{% endif %}
